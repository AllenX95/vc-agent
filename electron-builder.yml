appId: com.vcagent.desktop
productName: VC Agent
copyright: Copyright © 2026
extraMetadata:
  type: commonjs

directories:
  output: release

electronDist: node_modules/electron/dist
npmRebuild: false
asar: true
compression: maximum

files:
  - package.json
  - apps/desktop/dist/**/*
  - "!**/*.map"

extraResources:
  - from: apps/agent-worker/dist
    to: workers/agent-worker/dist
    filter:
      - "**/*"
      - "!**/*.map"
  - from: apps/agent-worker/package.json
    to: workers/agent-worker/package.json
  - from: apps/utility-worker/dist
    to: workers/utility-worker/dist
    filter:
      - "**/*"
      - "!**/*.map"
  - from: apps/utility-worker/package.json
    to: workers/utility-worker/package.json
  - from: skills/academic-research
    to: bundled-skills/academic-research
    filter:
      - "**/*"
  - from: packaging/parser-runtime
    to: parser-runtime
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
  - from: packaging/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: VC-Agent-Setup-${version}-${arch}.${ext}
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: VC Agent
  deleteAppDataOnUninstall: false
  differentialPackage: false

publish: null
